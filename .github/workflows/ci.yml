name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t tunnelcheck .
      - name: Demo scan exits 1 because the demo account has open hostnames
        run: |
          set +e
          docker run --rm tunnelcheck scan --demo
          test $? -eq 1
