name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t tunnelcheck .
      - name: Image has no known vulnerabilities with a fix available
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --quiet --scanners vuln --ignore-unfixed --exit-code 1 tunnelcheck
      - name: Demo scan exits 1 because the demo account has open hostnames
        run: |
          set +e
          docker run --rm tunnelcheck scan --demo
          test $? -eq 1
